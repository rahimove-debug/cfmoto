name: Apply prepared CFMOTO site update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cfmoto-site-update-v12-finance-20260826.tar.gz"

permissions:
  contents: write

concurrency:
  group: cfmoto-site-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify, apply and audit prepared update
        shell: bash
        run: |
          set -euo pipefail
          archive="cfmoto-site-update-v12-finance-20260826.tar.gz"
          apply_workflow=".github/workflows/apply-site-update.yml"
          import_workflow=".github/workflows/import-site.yml"
          if [[ ! -f "$archive" ]]; then
            echo "Prepared archive is already applied."
            exit 0
          fi
          echo "130ae6d651c607fdd7062790d4186e1b7472ab3fb174e10e210eadc43ee175d9  $archive" | sha256sum -c -
          cp "$apply_workflow" /tmp/apply-site-update.yml
          cp "$import_workflow" /tmp/import-site.yml
          tar -xzf "$archive"
          cp /tmp/apply-site-update.yml "$apply_workflow"
          cp /tmp/import-site.yml "$import_workflow"
          find . -type f -name '._*' -delete
          rm -f "$archive"
          find assets -maxdepth 1 -type f -name '*CfmotoAug24Fix.js' -delete
          rm -f assets/index-DiLMqMiY.css
          ruby scripts/build_cloudflare.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix installment calculator interest"
          git push
