name: Apply prepared CFMOTO site update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "deploy-parts/v18/**"
      - "deploy-overlay/**"

permissions:
  contents: write

concurrency:
  group: cfmoto-site-update-v18
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify, apply and audit prepared update
        shell: bash
        run: |
          set -euo pipefail
          parts_dir="deploy-parts/v18"
          archive="/tmp/cfmoto-c6-v18.tar.gz"
          overlay="deploy-overlay/v18.tar.gz"
          apply_workflow=".github/workflows/apply-site-update.yml"
          import_workflow=".github/workflows/import-site.yml"

          if [[ ! -d "$parts_dir" && ! -f "$overlay" ]]; then
            echo "Prepared archives are already applied."
            exit 0
          fi

          cp "$apply_workflow" /tmp/apply-site-update.yml
          cp "$import_workflow" /tmp/import-site.yml

          if [[ -d "$parts_dir" ]]; then
            cat "$parts_dir"/part-* | base64 --decode > "$archive"
            echo "7b854d8282283ab513f22454b9b2d905c04338a50c7fcba4db40c016112432c3  $archive" | sha256sum -c -
            tar -xzf "$archive"
          fi

          if [[ -f "$overlay" ]]; then
            echo "7b854d8282283ab513f22454b9b2d905c04338a50c7fcba4db40c016112432c3  $overlay" | sha256sum -c -
            tar -xzf "$overlay"
          fi

          cp /tmp/apply-site-update.yml "$apply_workflow"
          cp /tmp/import-site.yml "$import_workflow"
          if [[ -f .cfmoto-delete-list ]]; then
            while IFS= read -r obsolete_path; do
              [[ -z "$obsolete_path" ]] && continue
              [[ "$obsolete_path" == /* || "$obsolete_path" == *".."* ]] && { echo "Unsafe delete path: $obsolete_path"; exit 1; }
              rm -f -- "$obsolete_path"
            done < .cfmoto-delete-list
            rm -f .cfmoto-delete-list
          fi
          find . -type f -name '._*' -delete
          rm -rf "$parts_dir" "deploy-parts/v17" "deploy-parts/v13" "deploy-parts/v13b" "deploy-overlay"
          find assets -maxdepth 1 -type f -name '*CfmotoAug24Fix.js' -delete
          rm -f assets/index-DiLMqMiY.css
          ruby scripts/build_cloudflare.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add CFORCE C6 PRO preorder launch"
          git push
