name: Publish prepared CFORCE C4 and C5 news

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfmoto-news-publish-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, verify and commit prepared news update
        shell: bash
        env:
          OVERLAY_B64: >-
            
        run: |
          set -euo pipefail
          archive="/tmp/cfmoto-news-overlay-20260829.tar.gz"
          workflow=".github/workflows/apply-site-update.yml"

          git show 80150b41473006180ccdc8867efad43b9a94499b:"$workflow" > /tmp/apply-site-update-original.yml
          printf '%s' "$OVERLAY_B64" | base64 --decode > "$archive"
          echo "5286d5ffc25e272bbc91700ffedfaf2b957a6910c2c261de5d6a2839ac9c8499  $archive" | sha256sum -c -
          tar -xzf "$archive"
          cp /tmp/apply-site-update-original.yml "$workflow"

          ruby scripts/build_cloudflare.rb
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "$workflow" \
            README.md \
            _headers \
            assets/cfmoto-news-v1.css \
            scripts/apply_analytics.rb \
            scripts/apply_news_integration.rb \
            scripts/audit_news_integration.rb \
            scripts/build_cloudflare.rb \
            scripts/news_config.rb \
            xeberler/index.html \
            xeberler/cforce-c4-c5-artiq-azerbaycanda/index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Publish CFORCE C4 and C5 Azerbaijan news"
          git push
