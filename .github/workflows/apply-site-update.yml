name: Apply prepared CFMOTO site update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "deploy-parts/v13b/**"
      - "deploy-overlay/**"

permissions:
  contents: write

concurrency:
  group: cfmoto-site-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify, apply and audit prepared update
        shell: bash
        run: |
          set -euo pipefail
          parts_dir="deploy-parts/v13b"
          archive="/tmp/cfmoto-site-update-v13-accessories-20260826.tar.gz"
          overlay="deploy-overlay/v14.tar.gz"
          apply_workflow=".github/workflows/apply-site-update.yml"
          import_workflow=".github/workflows/import-site.yml"

          if [[ ! -d "$parts_dir" && ! -f "$overlay" ]]; then
            echo "Prepared archives are already applied."
            exit 0
          fi

          cp "$apply_workflow" /tmp/apply-site-update.yml
          cp "$import_workflow" /tmp/import-site.yml

          if [[ -d "$parts_dir" ]]; then
            cat "$parts_dir"/part-* | base64 --decode > "$archive"
            echo "a4ad93fae6d0a399a1a83ec6f2206677b30118d4606d29c2e3aaab706a4bcfcb  $archive" | sha256sum -c -
            tar -xzf "$archive"
          fi

          if [[ -f "$overlay" ]]; then
            echo "fdfc7689be49fd89bbe22c084e3670c8dc8aad233bce5b4796060d9b21b89213  $overlay" | sha256sum -c -
            tar -xzf "$overlay"
          fi

          cp /tmp/apply-site-update.yml "$apply_workflow"
          cp /tmp/import-site.yml "$import_workflow"
          find . -type f -name '._*' -delete
          rm -rf "$parts_dir" "deploy-parts/v13" "deploy-overlay"
          find assets -maxdepth 1 -type f -name '*CfmotoAug24Fix.js' -delete
          rm -f assets/index-DiLMqMiY.css
          ruby scripts/build_cloudflare.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish prominent accessory configurator CTAs"
          git push
