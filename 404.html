<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>Səhifə tapılmadı | CFMOTO Azerbaijan</title>
    <meta name="description" content="Axtardığınız səhifə tapılmadı. CFMOTO Azerbaijan ana səhifəsinə və model kataloquna qayıdın." />
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; --blue: #009bb4; --ink: #17191a; --muted: #667076; --paper: #f3f6f7; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 32px; display: grid; place-items: center; background: linear-gradient(135deg, #fff 0%, var(--paper) 100%); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
      main { width: min(720px, 100%); padding: clamp(32px, 7vw, 72px); background: #fff; border: 1px solid #dce3e6; box-shadow: 0 24px 70px rgba(16, 35, 42, .11); }
      img { width: min(220px, 58vw); height: auto; }
      .code { margin: 48px 0 8px; color: var(--blue); font-size: 14px; font-weight: 800; letter-spacing: .18em; }
      h1 { margin: 0; font-size: clamp(42px, 8vw, 78px); line-height: .95; letter-spacing: -.045em; text-transform: uppercase; }
      p { max-width: 560px; margin: 24px 0 34px; color: var(--muted); font-size: 18px; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      a { min-height: 48px; padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--ink); color: var(--ink); font-weight: 700; text-decoration: none; transition: transform .2s; }
      a:first-child { border-color: var(--blue); background: var(--blue); color: #fff; }
      a:hover { transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <main>
      <a href="/" aria-label="CFMOTO Azerbaijan ana səhifə"><img src="/cfmoto-logo-black.png" alt="CFMOTO Azerbaijan" /></a>
      <div class="code">404 · SƏHİFƏ TAPILMADI</div>
      <h1>Bu yol burada bitir.</h1>
      <p>Axtardığınız ünvan dəyişdirilib və ya artıq mövcud deyil. Ana səhifəyə qayıdın, yaxud aktual CFMOTO modellərinə baxın.</p>
      <nav aria-label="404 səhifəsi keçidləri">
        <a href="/">Ana səhifə</a>
        <a href="/#modeller">Modellərə bax</a>
      </nav>
    </main>
  </body>
</html>
